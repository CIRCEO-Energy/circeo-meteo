# Study box and dataset definitions (single source of truth for every script).
# Box (generous): North Atlantic from the Cape Verde / Caribbean latitude to the Denmark Strait,
# from the US East Coast to the North Sea and the western Mediterranean (S5: the best cells sat on
# the old 32W edge). 20-75N, 80W-15E.
box:
  lat_min: 20.0
  lat_max: 75.0
  lon_min: -80.0
  lon_max: 15.0

datasets:
  era5:
    title: ERA5 hourly 10 m wind (reanalysis, "truth")
    source: gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
    licence: Copernicus licence (free, commercial use allowed, attribution)
    years: [1995, 2025]      # 31 years
    res: 0.25                # native ERA5 grid, hourly (native); one file per month
    vars: [u10, v10]
    release: era5-uv10-0p25-v2
  era5_waves:
    title: ERA5 hourly ocean waves (ECMWF WAM coupled to IFS); native wave grid 0.5 deg
    source: gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
    licence: Copernicus licence (free, commercial use allowed, attribution)
    years: [1995, 2025]
    res: 0.5                 # selection of the native 0.5 deg wave points (no averaging)
    vars: [swh, mwd, mwp, pp1d, shww, mdww, mpww, shts, mdts, mpts]
    release: era5-waves-0p5-v2
  era5_sst:
    title: ERA5 sea surface temperature (OSTIA-based), daily means
    source: gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
    licence: Copernicus licence (free, commercial use allowed, attribution)
    years: [1995, 2025]
    res: 0.25
    vars: [sst]
    release: era5-sst-0p25-v2
  gefs_reforecast:
    title: NOAA GEFSv12 reforecast (frozen model, 00 UTC, control + 4 members, days 1-10)
    source: s3://noaa-gefs-retrospective/GEFSv12/reforecast
    licence: NOAA open data (no restriction, attribution requested)
    years: [2000, 2019]
    members: [c00, p01, p02, p03, p04]
    leads_h: [0, 240, 6]
    res: 1.0
    release: gefsv12-reforecast-uv10-1p0-v2
  gefs_oper:
    title: NOAA GEFS operational (v12 since 2020-09-23), 00 UTC
    source: s3://noaa-gefs-pds
    licence: NOAA open data
    years: [2021, 2025]
    members: 10          # perturbed members kept in addition to the control
    leads_h: [0, 240, 6]
    res: 1.0
    release: gefs-oper-uv10-1p0-v2
  gfs_wave:
    title: NOAA GFS-Wave (WAVEWATCH III, GFSv16+), global 0.25 deg, 00 UTC, native steps
    source: s3://noaa-gfs-bdp-pds (gfs.<date>/<HH>/wave/gridded/gfswave.t<HH>z.global.0p25.f<FFF>.grib2)
    licence: NOAA open data
    years: [2021, 2025]      # archive starts 2021-03-22 (GFSv16)
    runs: [0]
    steps: [[0, 120, 3], [126, 240, 6]]
    res: 0.25
    release: gfs-wave-0p25-v2
  cmems_phy_reanalysis:
    title: Copernicus Marine GLORYS12 reanalysis (GLOBAL_MULTIYEAR_PHY_001_030), daily, 1/12 deg
    dataset_id: cmems_mod_glo_phy_my_0.083deg_P1D-m
    interim_id: cmems_mod_glo_phy_myint_0.083deg_P1D-m
    vars: {uo: uo, vo: vo, thetao: thetao}
    depth: [0.0, 1.0]        # surface layer (0.49 m)
    licence: Copernicus Marine Service licence (free, commercial use allowed, attribution)
    years: [1995, 2025]
    release: cmems-glorys12-surface-v2
  cmems_phy_forecast:
    title: Copernicus Marine global analysis & forecast (GLOBAL_ANALYSISFORECAST_PHY_001_024), hourly surface
    dataset_id: cmems_mod_glo_phy_anfc_0.083deg_PT1H-m
    vars: {uo: uo, vo: vo, thetao: thetao}
    licence: Copernicus Marine Service licence (free, commercial use allowed, attribution)
    release: cmems-phy-anfc-hourly-v2
  cmems_wav_reanalysis:
    title: Copernicus Marine WAVERYS wave reanalysis (GLOBAL_MULTIYEAR_WAV_001_032), 3-hourly, 0.2 deg
    dataset_id: cmems_mod_glo_wav_my_0.2deg_PT3H-i
    vars: {VHM0: swh, VMDR: mwd, VTM10: mwp, VTPK: pp1d, VHM0_WW: shww, VMDR_WW: mdww, VHM0_SW1: shts, VMDR_SW1: mdts, VTM01_SW1: mpts}
    licence: Copernicus Marine Service licence (free, commercial use allowed, attribution)
    years: [1995, 2025]
    release: cmems-waverys-v2
  ecmwf_hres_wb2:
    title: ECMWF IFS HRES 2016-2022 (WeatherBench 2 copy of the ECMWF archive), 00/12 UTC
    source: gs://weatherbench2/datasets/hres/2016-2022-0012-1440x721.zarr
    licence: CHECK the LICENSE file printed by the script (TIGGE-derived WB2 datasets are
      research-only; HRES comes from the ECMWF archive, CC-BY-4.0 for historical data)
    years: [2016, 2022]
    leads_h: [0, 240, 6]
    res: 0.5
    release: ecmwf-hres-wb2-uv10-0p5-v2
  ecmwf_open:
    title: ECMWF open data (IFS HRES/oper, IFS ENS, AIFS single)
    source: AWS mirror s3://ecmwf-forecasts (read with meteo/ecmwf_fetch.py)
    licence: CC-BY-4.0 (ECMWF open data)
    # deterministic products at native resolution and native output steps; the ensemble is
    # thinned (1 deg, control + 20 members, 6-hourly) to stay at ~6 GB per year
    products:
      oper: {res: 0.25, runs: [0, 12], steps: [[0, 144, 3], [150, 240, 6]]}
      aifs: {res: 0.25, runs: [0, 12], steps: [[0, 360, 6]]}
      enfo: {res: 1.0, runs: [0], members: 20, steps: [[0, 360, 6]]}
      wave: {res: 0.25, runs: [0, 12], steps: [[0, 144, 3], [150, 240, 6]]}   # ECMWF WAM (HRES)
    release: ecmwf-open-v2
