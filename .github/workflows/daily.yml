# Daily aggregation of the prospective archive. Each run re-checks the last 3 days, fetches only
# the missing initialisations and merges them into ONE file per product and month, re-uploaded to
# this repository's Releases:
#   ECMWF open data: IFS HRES wind, IFS ENS wind, AIFS wind, ECMWF WAM waves -> ecmwf-open-v2
#   NOAA: GEFS wind -> gefs-oper-uv10-1p0-v2 ; GFS-Wave -> gfs-wave-0p25-v2
#   Copernicus Marine: today's 10-day hourly surface currents + temperature forecast (one file per
#   day, needs the COPERNICUSMARINE_SERVICE_USERNAME / _PASSWORD secrets) -> cmems-phy-anfc-hourly-v2
name: daily
on:
  schedule:
    - cron: '17 9 * * *'     # 09:17 UTC, after the 00 UTC runs are published on the mirrors
  workflow_dispatch:
    inputs:
      lookback:
        description: days to re-check (raise it to backfill a gap, max ~30)
        default: '3'
permissions:
  contents: write
concurrency:
  group: daily-archive
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: download the current monthly files
        run: |
          mkdir -p monthly
          for TAG in ecmwf-open-v2 gefs-oper-uv10-1p0-v2 gfs-wave-0p25-v2; do
            for M in $(date -u -d '-30 days' +%Y%m) $(date -u +%Y%m); do
              gh release download "$TAG" -R "$REPO" -p "*_${M}.nc" -D monthly --skip-existing 2>/dev/null || true
            done
          done
          ls -la monthly
      - name: fetch missing days and merge
        run: python -m meteo.aggregate --dir monthly --lookback ${{ inputs.lookback || '3' }}
      - name: upload updated monthly files
        run: |
          for f in $(cat monthly/touched.txt); do
            case "$(basename $f)" in
              gefs_*) TAG=gefs-oper-uv10-1p0-v2;;
              gfs_wave_*) TAG=gfs-wave-0p25-v2;;
              *) TAG=ecmwf-open-v2;;
            esac
            gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
              gh release create "$TAG" -R "$REPO" --title "$TAG" --notes-file docs/release_notes.md
            M="monthly/manifest_$(basename ${f%.nc}).json"
            gh release upload "$TAG" "$f" "$M" -R "$REPO" --clobber
          done
      - name: Copernicus Marine forecast of the day (currents, temperature)
        if: ${{ env.CMEMS_USER != '' }}
        env:
          CMEMS_USER: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          python -m meteo.build cmems_phy_forecast --year $(date -u +%Y) --out cmems
          TAG=cmems-phy-anfc-hourly-v2
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$REPO" --title "$TAG" --notes-file docs/release_notes.md
          gh release upload "$TAG" cmems/* -R "$REPO" --clobber
