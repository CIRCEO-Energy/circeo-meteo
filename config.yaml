# Study box and dataset definitions (single source of truth for every script).
# Box (generous): North Atlantic from the Cape Verde / Caribbean latitude to the Denmark Strait,
# from the US East Coast to the North Sea and the western Mediterranean (S5: the best cells sat on
# the old 32W edge). 20-75N, 80W-15E.
box:
  lat_min: 20.0
  lat_max: 75.0
  lon_min: -80.0
  lon_max: 15.0

datasets:
  era5:
    title: ERA5 hourly 10 m wind (reanalysis, "truth")
    source: gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
    licence: Copernicus licence (free, commercial use allowed, attribution)
    years: [1995, 2025]      # 31 years
    res: 0.25                # native ERA5 grid, hourly (native); one file per month
    vars: [u10, v10]
    release: era5-uv10-0p25-v2
  era5_waves:
    title: ERA5 hourly ocean waves (ECMWF WAM coupled to IFS); native wave grid 0.5 deg
    source: gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
    licence: Copernicus licence (free, commercial use allowed, attribution)
    years: [1995, 2025]
    res: 0.5                 # selection of the native 0.5 deg wave points (no averaging)
    vars: [swh, mwd, mwp, pp1d, shww, mdww, mpww, shts, mdts, mpts]
    release: era5-waves-0p5-v2
  era5_sst:
    title: ERA5 sea surface temperature (OSTIA-based), daily means
    source: gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
    licence: Copernicus licence (free, commercial use allowed, attribution)
    years: [1995, 2025]
    res: 0.25
    vars: [sst]
    release: era5-sst-0p25-v2
  era5_z500:
    title: ERA5 500 hPa geopotential height, daily mean of 00 and 12 UTC (weather regimes)
    source: gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
    licence: Copernicus licence (free, commercial use allowed, attribution)
    years: [1995, 2025]
    res: 1.0                 # selection of the 1 deg points (a smooth field, no averaging needed)
    vars: [z500]
    box: {lat_min: 20.0, lat_max: 80.0, lon_min: -90.0, lon_max: 40.0}  # Euro-Atlantic regime domain
    release: era5-z500-1p0-v1
  era5_synoptic:
    title: ERA5 synoptic predictors, daily mean of 00 and 12 UTC, 1 deg (statistical downscaling of the surface wind)
    source: gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3
    licence: Copernicus licence (free, commercial use allowed, attribution)
    years: [1995, 2025]
    res: 1.0
    # name: [ARCO variable, pressure level or null]; z in gpm, t in K, mslp in hPa
    vars: {z500: [geopotential, 500], z1000: [geopotential, 1000], mslp: [mean_sea_level_pressure, null],
           t850: [temperature, 850], t700: [temperature, 700], t500: [temperature, 500],
           t2m: [2m_temperature, null]}
    box: {lat_min: 0.0, lat_max: 80.0, lon_min: -90.0, lon_max: 40.0}  # Euro-Atlantic + trade winds
    release: era5-synoptic-1p0-v1
  ibtracs:
    title: IBTrACS v04r01 North Atlantic best tracks, 1995 onwards (tropical-cyclone exposure)
    source: https://www.ncei.noaa.gov/products/international-best-track-archive
    licence: public domain (NOAA NCEI), cite Knapp et al. 2010
    release: ibtracs-na-v04r01
# --------------------------------------------------------------------------------- forecasts
# Published in boris-circeo/circeo-meteo-forecasts. Wind: deterministic runs and ensemble controls
# at native resolution (0.25 deg) and native output steps; full ensembles (all members, native
# steps) archived at 0.5 deg, their full-resolution statistics computed on the runners (verify).
# "file: daily" products are written one file per day into one Release per year ({year}).
  gefs_reforecast:
    title: NOAA GEFSv12 reforecast (frozen model), 00 UTC, all members (5, 11 on Wednesdays), days 1-10
    source: s3://noaa-gefs-retrospective/GEFSv12/reforecast
    licence: NOAA open data (no restriction, attribution requested)
    years: [2000, 2019]
    members: all
    leads_h: [[3, 240, 3]]    # the reforecast files start at +3 h (no analysis step)
    res: 0.5
    file: monthly
    release: gefsv12-reforecast-uv10-0p5-v2
  gefs_reforecast_syn:
    title: NOAA GEFSv12 reforecast control, 00 UTC, MSLP and Z500 (downscaling predictors), days 1-10, 1 deg
    source: s3://noaa-gefs-retrospective/GEFSv12/reforecast
    licence: NOAA open data (no restriction, attribution requested)
    years: [2000, 2019]
    members: [c00]
    leads_h: [[12, 240, 12]]
    res: 1.0
    box: {lat_min: 0.0, lat_max: 80.0, lon_min: -90.0, lon_max: 40.0}
    file: monthly
    release: gefsv12-reforecast-syn-1p0-v1
  gefs_oper:
    title: NOAA GEFS operational ensemble (v12 since 2020-09-23), 00 UTC, control + 30 members
    source: s3://noaa-gefs-pds (atmos/pgrb2ap5)
    licence: NOAA open data
    years: [2023, 2025]      # common period with the ECMWF open-data archive (client decision)
    members: 30
    leads_h: [[0, 240, 3], [246, 384, 6]]
    res: 0.5
    file: daily
    release: gefs-oper-uv10-0p5-{year}
  gefs_ctl:
    title: NOAA GEFS operational control member at native 0.25 deg (atmos/pgrb2sp25), 00 UTC
    source: s3://noaa-gefs-pds (atmos/pgrb2sp25)
    licence: NOAA open data
    years: [2023, 2025]
    leads_h: [[0, 240, 3]]
    res: 0.25
    file: monthly
    release: gefs-ctl-uv10-0p25-v2
  gfs_wave:
    title: NOAA GFS-Wave (WAVEWATCH III, GFSv16+), 00 UTC, native steps, stored at 0.5 deg
    source: s3://noaa-gfs-bdp-pds (gfs.<date>/<HH>/wave/gridded/gfswave.t<HH>z.global.0p25.f<FFF>.grib2)
    licence: NOAA open data
    years: [2021, 2025]      # archive starts 2021-03-22 (GFSv16)
    runs: [0]
    steps: [[0, 120, 3], [126, 240, 6]]
    res: 0.5
    file: monthly
    release: gfs-wave-0p5-v2
  cmems_phy_reanalysis:
    title: Copernicus Marine GLORYS12 reanalysis (GLOBAL_MULTIYEAR_PHY_001_030), daily, stored at 0.25 deg
    dataset_id: cmems_mod_glo_phy_my_0.083deg_P1D-m
    interim_id: cmems_mod_glo_phy_myint_0.083deg_P1D-m
    vars: {uo: uo, vo: vo, thetao: thetao}
    depth: [0.0, 1.0]        # surface layer (0.49 m)
    res: 0.25
    licence: Copernicus Marine Service licence (free, commercial use allowed, attribution)
    years: [1995, 2025]
    release: cmems-glorys12-surface-v2
  cmems_phy_forecast:
    title: Copernicus Marine global analysis & forecast (GLOBAL_ANALYSISFORECAST_PHY_001_024), hourly surface, stored at 0.25 deg
    dataset_id: cmems_mod_glo_phy_anfc_0.083deg_PT1H-m
    vars: {uo: uo, vo: vo, thetao: thetao}
    licence: Copernicus Marine Service licence (free, commercial use allowed, attribution)
    res: 0.25
    release: cmems-phy-anfc-hourly-v2
  cmems_wav_reanalysis:
    title: Copernicus Marine WAVERYS wave reanalysis (GLOBAL_MULTIYEAR_WAV_001_032), 3-hourly, 0.2 deg
    dataset_id: cmems_mod_glo_wav_my_0.2deg_PT3H-i
    vars: {VHM0: swh, VMDR: mwd, VTM10: mwp, VTPK: pp1d, VHM0_WW: shww, VMDR_WW: mdww, VHM0_SW1: shts, VMDR_SW1: mdts, VTM01_SW1: mpts}
    licence: Copernicus Marine Service licence (free, commercial use allowed, attribution)
    years: [1995, 2025]
    release: cmems-waverys-v2
  ecmwf_hres_wb2:
    title: ECMWF IFS HRES 2016-2022 (WeatherBench 2 copy of the ECMWF archive), 00/12 UTC
    source: gs://weatherbench2/datasets/hres/2016-2022-0012-1440x721.zarr
    licence: CHECK the LICENSE file printed by the script (TIGGE-derived WB2 datasets are
      research-only; HRES comes from the ECMWF archive, CC-BY-4.0 for historical data)
    years: [2016, 2022]
    leads_h: [0, 240, 6]
    res: 0.5
    release: ecmwf-hres-wb2-uv10-0p5-v2
  ecmwf_open:
    title: ECMWF open data (IFS HRES/oper, IFS ENS, AIFS single, WAM waves)
    source: AWS mirror s3://ecmwf-forecasts (read with meteo/ecmwf_fetch.py)
    licence: CC-BY-4.0 (ECMWF open data)
    products:
      oper: {res: 0.25, runs: [0, 12], steps: [[0, 144, 3], [150, 240, 6]], file: monthly,
             release: ecmwf-oper-uv10-0p25-v2}
      aifs: {res: 0.25, runs: [0, 12], steps: [[0, 360, 6]], file: monthly,
             release: ecmwf-aifs-uv10-0p25-v2}
      enfo: {res: 0.5, runs: [0], members: 50, steps: [[0, 144, 3], [150, 360, 6]],
             file: daily, release: "ecmwf-enfo-uv10-0p5-{year}"}
      wave: {res: 0.5, runs: [0, 12], steps: [[0, 144, 3], [150, 240, 6]], file: monthly,
             release: ecmwf-wave-0p5-v2}
