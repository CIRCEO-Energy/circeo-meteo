# Daily aggregation of the prospective archive (ECMWF IFS HRES, IFS ENS, AIFS single; NOAA GEFS).
# Each run re-checks the last 3 days, fetches only the missing initialisations, merges them into
# ONE file per product and month, and re-uploads those monthly files to the Releases of this
# (public) repository. ECMWF's own portal keeps only a few days: this builds our continuous record.
name: daily
on:
  schedule:
    - cron: '17 9 * * *'     # 09:17 UTC, after the 00 UTC runs are published on the mirrors
  workflow_dispatch:
    inputs:
      lookback:
        description: days to re-check (raise it to backfill a gap, max ~30)
        default: '3'
permissions:
  contents: write            # create/update Releases of this repository with GITHUB_TOKEN
concurrency:
  group: daily-archive
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - name: download the current monthly files
        run: |
          mkdir -p monthly
          for TAG in ecmwf-open-uv10-v1 gefs-oper-uv10-1p0-v1; do
            for M in $(date -u -d '-30 days' +%Y%m) $(date -u +%Y%m); do
              gh release download "$TAG" -R "$REPO" -p "*_${M}.nc" -D monthly --skip-existing 2>/dev/null || true
            done
          done
          ls -la monthly
      - name: fetch missing days and merge
        run: python -m meteo.aggregate --dir monthly --lookback ${{ inputs.lookback || '3' }}
      - name: upload updated monthly files
        run: |
          for f in $(cat monthly/touched.txt); do
            case "$(basename $f)" in gefs_*) TAG=gefs-oper-uv10-1p0-v1;; *) TAG=ecmwf-open-uv10-v1;; esac
            gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
              gh release create "$TAG" -R "$REPO" --title "$TAG" --notes-file docs/release_notes.md
            M="monthly/manifest_$(basename ${f%.nc}).json"
            gh release upload "$TAG" "$f" "$M" -R "$REPO" --clobber
          done
